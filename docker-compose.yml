services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: event-finder-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: event_finder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_finder"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: event-finder-server
    restart: always
    environment:
      PORT: 5050
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/event_finder?schema=public
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforlocaldevelopment123}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      USE_SAMPLE_EVENTS: ${USE_SAMPLE_EVENTS:-true}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: event-finder-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
